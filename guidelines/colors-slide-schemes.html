<!-- @dsCard group="Colors" viewport="700x340" name="Slide Color Schemes" subtitle="Sanctioned background/text pairings per slide type — solid + gradient" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-brand);color:var(--text-heading);background:#fff}a{color:var(--accent)}a:hover{color:var(--accent-hover)}.row{display:flex;gap:12px;padding:16px}.sw{flex:1;border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}.sw b{font-weight:400;font-size:14px}.sw span{font-size:11px;opacity:.75}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px">
<div style="background:#142032;border-radius:8px;padding:14px"><div style="color:#fff;font-size:14px">Cover / Closing</div><div style="color:#A1A8B7;font-size:11px;line-height:1.5">Subtitle</div><div style="height:1px;width:32px;background:#F71963;margin-top:8px"></div></div>
<div style="background:#F71963;border-radius:8px;padding:14px"><div style="color:#fff;font-size:14px">Section divider</div><div style="color:#fff;font-size:11px;line-height:1.5;opacity:.9">Subtitle</div><div style="height:1px;width:32px;background-color:#FFFFFF;margin-top:8px"></div></div>
<div style="background:#F5F9FF;border:1px solid #E7E9EE;border-radius:8px;padding:14px"><div style="color:#142032;font-size:14px">Content</div><div style="color:#5B6E84;font-size:11px;line-height:1.5">Subtitle</div><div style="height:1px;width:32px;background:#F71963;margin-top:8px"></div></div>
<div style="background:#fff;border:1px solid #E7E9EE;border-radius:8px;padding:14px"><div style="color:#142032;font-size:14px">Data / chart</div><div style="color:#5B6E84;font-size:11px;line-height:1.5">Subtitle</div><div style="height:1px;width:32px;background:#F71963;margin-top:8px"></div></div>
<div style="background:#FFF3F6;border-radius:8px;padding:14px"><div style="color:#F71963;font-size:14px">Quote</div><div style="color:#5B6E84;font-size:11px;line-height:1.5">Body #5B6E84</div><div style="height:1px;width:32px;background:#F71963;margin-top:8px"></div></div>
<div style="background:var(--gradient-section-divider,linear-gradient(150deg,#060F23 0%,#1B0F2E 45%,#7E1246 78%,#C21455 100%));border-radius:8px;padding:14px"><div style="color:#fff;font-size:14px">Section divider (gradient)</div><div style="color:#fff;font-size:11px;line-height:1.5;opacity:.85">Subtitle</div><div style="height:1px;width:32px;background:#fff;margin-top:8px"></div></div>
<div style="background:var(--gradient-slide-blush,linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 52%,#FEE7EE 100%));border:1px solid #E7E9EE;border-radius:8px;padding:14px"><div style="color:#F71963;font-size:14px">Content (blush)</div><div style="color:#5B6E84;font-size:11px;line-height:1.5">Subtitle</div><div style="height:1px;width:32px;background:#F71963;margin-top:8px"></div></div>
<div style="background:var(--gradient-sirius-black,linear-gradient(180deg,#060F23 0%,#2C4872 100%));border-radius:8px;padding:14px"><div style="color:#fff;font-size:14px">Dark hero (gradient)</div><div style="color:#A1A8B7;font-size:11px;line-height:1.5">Subtitle</div><div style="height:1px;width:32px;background:#F71963;margin-top:8px"></div></div>
<div style="background:var(--gradient-strawberry-pink,linear-gradient(180deg,#F71963 0%,#FF6F9F 100%));border-radius:8px;padding:14px"><div style="color:#fff;font-size:14px">Hero / CTA (gradient)</div><div style="color:#fff;font-size:11px;line-height:1.5;opacity:.9">Subtitle</div><div style="height:1px;width:32px;background:#fff;margin-top:8px"></div></div>
</div></body></html>
