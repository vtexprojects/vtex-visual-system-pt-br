<script>
let lang='en';const figs=[...document.querySelectorAll('figure')];let PH={};fetch('../assets/images/photos.json').then(r=>r.json()).then(j=>{PH=j;figs.forEach(f=>{if(f.dataset.loaded)placePhotos(f)})});

// occlusion: clip the overlay to (host bbox ∩ photo) minus every later layer's bbox that overlaps it (later layers draw on top in the original)
function ubox(el,svg){const b=el.getBBox();const M=el.getCTM();if(!M)return b;const pts=[[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]].map(([x,y])=>{const p=svg.createSVGPoint();p.x=x;p.y=y;const q=p.matrixTransform(M);return [q.x,q.y]});const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x=Math.min(...xs),y=Math.min(...ys);return{x,y,width:Math.max(...xs)-x,height:Math.max(...ys)-y}}
function hitAt(el,svg,x,y){try{const M=el.getCTM();const p=svg.createSVGPoint();p.x=x;p.y=y;const lp=M?p.matrixTransform(M.inverse()):p;return el.isPointInFill(lp)}catch(e){return false}}
function occluders(layers,hi,x0,y0,x1,y1,svg,ph){const cuts=[];const pts=[[(x0+x1)/2,(y0+y1)/2],[x0+2,y0+2],[x1-2,y0+2],[x0+2,y1-2],[x1-2,y1-2]];
// anchor: the photo's own pattern-filled placeholder (same box) — only elements AFTER it in document order can paint over the photo
let anchor=null;const pc=[ph.x+ph.w/2,ph.y+ph.h/2];for(const el of svg.querySelectorAll('[fill^="url(#pattern"]')){try{const b=ubox(el,svg);if(Math.abs(b.x-ph.x)<1.5&&Math.abs(b.y-ph.y)<1.5&&Math.abs(b.width-ph.w)<2&&Math.abs(b.height-ph.h)<2){anchor=el;break}}catch(e){}}
if(!anchor){for(const el of svg.querySelectorAll('[fill^="url(#pattern"]')){try{const b=ubox(el,svg);if(pc[0]>=b.x&&pc[0]<=b.x+b.width&&pc[1]>=b.y&&pc[1]<=b.y+b.height&&b.width<ph.w*3&&b.height<ph.h*3){anchor=el;break}}catch(e){}}}
if(!anchor)return cuts; // no placeholder found → never hide a photo on a guess
const all=svg.querySelectorAll('path,rect,circle,ellipse,polygon');let after=false;
for(const el of all){if(!after){if(el===anchor)after=true;continue}const f=el.getAttribute('fill');if(!f||f==='none'||f.startsWith('url(#pattern'))continue;if(!anchor&&hi>=0&&layers.slice(0,hi+1).some(L=>L.contains(el)))continue;let hit=false;for(const [px,py] of pts){if(hitAt(el,svg,px,py)){hit=true;break}}if(!hit)continue;try{const b=ubox(el,svg);if(b.width<6||b.height<6)continue;cuts.push([Math.max(x0,b.x),Math.max(y0,b.y),Math.min(x1,b.x+b.width),Math.min(y1,b.y+b.height)])}catch(e){}}return cuts}
function clipFor(ph,host,layers,vb,sc){const svg=(host||layers[0]).ownerSVGElement;const hb=host?ubox(host,svg):null;let x0=ph.x,y0=ph.y,x1=ph.x+ph.w,y1=ph.y+ph.h;if(hb){const ix=Math.max(0,Math.min(x1,hb.x+hb.width)-Math.max(x0,hb.x)),iy=Math.max(0,Math.min(y1,hb.y+hb.height)-Math.max(y0,hb.y));if(ix*iy>=0.9*ph.w*ph.h){x0=Math.max(x0,hb.x);y0=Math.max(y0,hb.y);x1=Math.min(x1,hb.x+hb.width);y1=Math.min(y1,hb.y+hb.height)}}
const hi=host?layers.indexOf(host):-1;const cut=occluders(layers,hi,x0,y0,x1,y1,svg,ph).filter(([a,b,c,d])=>c>a&&d>b);
// build clip as rect minus cuts → approximate by keeping the largest remaining vertical/horizontal band (cuts are popups: usually one side)
let rx0=x0,ry0=y0,rx1=x1,ry1=y1;for(const [cx0,cy0,cx1,cy1] of cut){const L=cx0-rx0,R=rx1-cx1,T=cy0-ry0,B=ry1-cy1;const m=Math.max(L,R,T,B);if(m<=0){rx1=rx0;break}if(m===L)rx1=cx0;else if(m===R)rx0=cx1;else if(m===T)ry1=cy0;else ry0=cy1}
const toPx=v=>(v*sc)+'px';return{visible:rx1>rx0&&ry1>ry0,inset:`inset(${toPx(ry0-ph.y)} ${toPx(ph.x+ph.w-rx1)} ${toPx(ph.y+ph.h-ry1)} ${toPx(rx0-ph.x)})`}}
function placePhotos(fig){const f=fig.querySelector('.f');f.querySelectorAll('.ph').forEach(e=>e.remove());const meta=PH[fig.dataset.slug];const svg=f.querySelector('svg');if(!meta||!svg)return;const vb=svg.getAttribute('viewBox').split(' ').map(Number);const W=f.clientWidth,H=f.clientHeight;const s=Math.min(W/vb[2],H/vb[3]);const ox=(W-vb[2]*s)/2,oy=(H-vb[3]*s)/2;
meta.photos.forEach((ph,i)=>{const im=document.createElement('img');im.className='ph';im.src='../'+ph.file;im.style.left=(ox+(ph.x-vb[0])*s)+'px';im.style.top=(oy+(ph.y-vb[1])*s)+'px';im.style.width=(ph.w*s)+'px';im.style.height=(ph.h*s)+'px';im.style.borderRadius=(ph.rx*s)+'px';
const layers=[...svg.querySelectorAll('.vl')];const cands=[];for(const g of layers){try{const b=ubox(g,svg);if(ph.x>=b.x-2&&ph.y>=b.y-2&&ph.x+ph.w<=b.x+b.width+2&&ph.y+ph.h<=b.y+b.height+2)cands.push([b.width*b.height,g])}catch(e){}}cands.sort((a,b)=>a[0]-b[0]);let host=cands.length?cands[0][1]:null;for(const el of svg.querySelectorAll('[fill^="url(#pattern"]')){try{const b=ubox(el,svg);const pc=[ph.x+ph.w/2,ph.y+ph.h/2];if(pc[0]>=b.x-1&&pc[0]<=b.x+b.width+1&&pc[1]>=b.y-1&&pc[1]<=b.y+b.height+1&&b.width<ph.w*3&&b.height<ph.h*3){const L=el.closest('.vl');if(L){host=L}break}}catch(e){}}
const delay=host?host.style.animationDelay:'0.3s';if(ph.emoji){im.style.objectFit='fill';im.style.borderRadius='0'}else{const cl=clipFor(ph,host,layers,vb,s);if(!cl.visible)return;im.style.clipPath=cl.inset}im.style.animation='vl .75s cubic-bezier(.16,.84,.44,1) '+delay+' both';f.appendChild(im)})}
async function load(fig){const f=fig.querySelector('.f');const s=fig.dataset.slug,t=fig.dataset.type;fig.querySelector('b').textContent=fig.querySelector('b').dataset['t'+lang.replace(/-(.)/g,(m,c)=>c.toUpperCase()).replace(/^./,c=>c.toUpperCase())]||fig.querySelector('b').dataset.tEn;
if(!fig.dataset.svg.split(',').includes(lang)){f.className='f';f.innerHTML='<img src="../assets/images/'+lang+'/'+t+'/'+s+'.png" alt="'+s+'" style="width:100%;height:100%;object-fit:contain;animation:vl .75s cubic-bezier(.16,.84,.44,1) .1s both" title="Static PNG (no SVG exported for '+lang.toUpperCase()+')">';return}
f.className='f';f.textContent='';try{const r=await fetch('../assets/images/'+lang+'/svg/'+t+'/'+s+'.svg?v='+Date.now());f.innerHTML=await r.text();placePhotos(fig)}catch(e){f.textContent='—'}}
function replay(fig){const f=fig.querySelector('.f');const h=f.innerHTML;f.innerHTML='';requestAnimationFrame(()=>{f.innerHTML=h;placePhotos(fig)})}
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.loaded){e.target.dataset.loaded=1;load(e.target)}})},{rootMargin:'200px'});
figs.forEach(f=>{io.observe(f);f.querySelector('.f').onclick=()=>replay(f)});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');lang=b.dataset.l;figs.forEach(f=>{if(f.dataset.loaded)load(f)})});
document.querySelector('.replay').onclick=()=>figs.forEach(f=>{if(f.dataset.loaded)replay(f)});
</script></body></html>
