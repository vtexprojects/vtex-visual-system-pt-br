<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-brand);color:var(--text-heading);background:#fff}a{color:var(--accent)}a:hover{color:var(--accent-hover)}.row{display:flex;gap:12px;padding:16px}.sw{flex:1;border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}.sw b{font-weight:400;font-size:14px}.sw span{font-size:11px;opacity:.75}</style></head><body><div class="row"><div class="sw" style="background:#E7E9EE"><b>Winter Gray</b><span>#E7E9EE · dividers, borders</span></div><div class="sw" style="background:#A1A8B7;color:#fff"><b>Cool Gray</b><span>#A1A8B7 · captions, metadata</span></div><div class="sw" style="background:#5B6E84;color:#fff"><b>Serious Gray</b><span>#5B6E84 · body text</span></div></div></body></html>
