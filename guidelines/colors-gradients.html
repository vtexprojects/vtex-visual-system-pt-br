<!-- @dsCard group="Colors" viewport="700x200" name="Semantic Gradients" subtitle="Strawberry Pink / Sirius Black / Neutral — vertical 180deg, from brand gradient spec" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-brand);}a{color:var(--accent)}a:hover{color:var(--accent-hover)}
.wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:16px}
.g{border-radius:10px;height:130px;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.name{font-weight:500;font-size:15px}
.tok{font-size:11px;font-family:ui-monospace,monospace;opacity:.85}
</style></head><body>
<div class="wrap">
<div class="g" style="background:var(--gradient-strawberry-pink);color:#fff"><span class="name">Strawberry Pink</span><span class="tok">--gradient-strawberry-pink<br>#F71963 → #FF6F9F</span></div>
<div class="g" style="background:var(--gradient-sirius-black);color:#fff"><span class="name">Sirius Black</span><span class="tok">--gradient-sirius-black<br>#060F23 → #2C4872</span></div>
<div class="g" style="background:var(--gradient-neutral);color:#142032"><span class="name">Neutral</span><span class="tok">--gradient-neutral<br>#C4CCD9 → #F6F7F9</span></div>
</div>
</body></html>
