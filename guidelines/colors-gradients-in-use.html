<!-- @dsCard group="Colors" viewport="700x360" name="Gradients in Use" subtitle="Full-bleed backgrounds and content boxes on each gradient" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-brand)}a{color:var(--accent)}a:hover{color:var(--accent-hover)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:16px}
.bg{border-radius:10px;height:150px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:6px}
.bg h3{margin:0;font-weight:400;font-size:17px;line-height:1.25}
.bg p{margin:0;font-size:12px;opacity:.8}
.boxes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:0 16px 16px}
.box{border-radius:10px;padding:14px;font-size:13px;font-weight:500}
</style></head><body>
<div class="row">
<div class="bg" style="background:var(--gradient-strawberry-pink);color:#fff"><h3>Hero section</h3><p>Strawberry Pink — headline moments, launch slides, CTAs</p></div>
<div class="bg" style="background:var(--gradient-sirius-black);color:#fff"><h3>Dark section</h3><p>Sirius Black — closing slides, footers, contrast blocks</p></div>
<div class="bg" style="background:var(--gradient-neutral);color:#142032"><h3>Light section</h3><p>Neutral — quiet backgrounds, dividers, data sections</p></div>
</div>
<div class="boxes">
<div class="box" style="background:var(--gradient-strawberry-pink);color:#fff">Highlight box</div>
<div class="box" style="background:var(--gradient-sirius-black);color:#fff">Stat / quote box</div>
<div class="box" style="background:var(--gradient-neutral);color:#142032">Neutral card</div>
</div>
</body></html>
