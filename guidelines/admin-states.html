<!-- @dsCard group="Colors" viewport="700x150" name="Admin State Colors" subtitle="Success, danger, warning — solid + faded pairs" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-brand);color:var(--text-heading);background:#fff}a{color:var(--accent)}a:hover{color:var(--accent-hover)}.row{display:flex;gap:12px;padding:16px}.sw{flex:1;border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}.sw b{font-weight:400;font-size:14px}.sw span{font-size:11px;opacity:.75}</style></head><body><div class="row"><div class="sw" style="background:#EAFCE3;color:#79B03A;border-top:4px solid #8BC34A"><b>Success</b><span>#8BC34A / #EAFCE3</span></div><div class="sw" style="background:#FFE6E6;color:#FF4C4C;border-top:4px solid #FF4C4C"><b>Danger</b><span>#FF4C4C / #FFE6E6</span></div><div class="sw" style="background:#FFF6E0;color:#E19D00;border-top:4px solid #FFB100"><b>Warning</b><span>#FFB100 / #FFF6E0</span></div></div></body></html>
